<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XAYLA</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05060b;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 20% 25%,rgba(255,86,190,.20),transparent 30%),
radial-gradient(circle at 80% 20%,rgba(114,92,255,.25),transparent 30%),
radial-gradient(circle at 50% 85%,rgba(48,213,255,.16),transparent 32%);z-index:-3}
.grid{position:fixed;inset:0;z-index:-2;opacity:.32;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent)}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(110px);background:#9b5cff;opacity:.12;left:50%;top:45%;transform:translate(-50%,-50%);z-index:-1}
main{height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.card{position:relative;width:min(820px,100%);padding:64px 28px;border:1px solid #ffffff18;border-radius:30px;background:linear-gradient(145deg,#ffffff0d,#ffffff04);backdrop-filter:blur(18px);box-shadow:0 45px 120px #000a;overflow:hidden}
.card:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(120deg,transparent,#ff73ca88,#8c7cff88,#66dcff66,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;pointer-events:none}
.mini{font-size:11px;font-weight:900;letter-spacing:.35em;color:#999fb7;text-transform:uppercase}
h1{font-size:clamp(70px,14vw,150px);line-height:.85;letter-spacing:-.07em;margin:24px 0 20px;background:linear-gradient(100deg,#fff,#ff92d1 35%,#a997ff 65%,#7ee7ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #a56cff2b)}
p{max-width:570px;margin:0 auto;color:#aeb4c8;font-size:clamp(15px,2vw,19px);line-height:1.7}
.secret{margin-top:30px;font-size:10px;letter-spacing:.22em;color:#5f657a;text-transform:uppercase}
.spark{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.4;animation:float 7s linear infinite}
@keyframes float{from{transform:translateY(110vh);opacity:0}20%{opacity:.45}to{transform:translateY(-20vh);opacity:0}}

.playground{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:30px auto 16px}
.clockbox,.moodbox{padding:18px;border:1px solid #ffffff14;border-radius:16px;background:#070913aa;text-align:left}
.clockbox span,.moodbox span{display:block;color:#686f88;font-size:9px;font-weight:900;letter-spacing:.18em;margin-bottom:7px}
.clockbox strong,.moodbox strong{font-size:18px}
.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:18px 0}
.controls button{border:1px solid #ffffff18;background:#ffffff0a;color:#e9eaff;padding:11px 15px;border-radius:999px;font-weight:800;cursor:pointer;transition:.25s;backdrop-filter:blur(10px)}
.controls button:hover{transform:translateY(-3px);border-color:#c292ff77;box-shadow:0 8px 28px #9c5cff22}
.message{min-height:24px;color:#d9dcf0;font-size:14px;margin-top:15px}
.pop{position:fixed;pointer-events:none;font-size:18px;animation:pop 1.4s ease-out forwards;z-index:99}
@keyframes pop{0%{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(180deg) scale(1.3);opacity:0}}
@media(max-width:600px){.playground{grid-template-columns:1fr}.card{padding:45px 20px}}

</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<main>
<section class="card">
<div class="mini">A hidden corner of the internet</div>
<h1>XAYLA</h1>
<p id="subtitle">Xayla's space.</p>

<div class="playground">
  <div class="clockbox">
    <span>LOCAL TIME</span>
    <strong id="clock">--:--</strong>
  </div>
  <div class="moodbox">
    <span>CURRENT VIBE</span>
    <strong id="vibe">✨ CHILL</strong>
  </div>
</div>

<div class="controls">
  <button onclick="newVibe()">Change vibe</button>
  <button onclick="burst()">✨ Sparkles</button>
  <button onclick="randomMessage()">Random message</button>
</div>

<div class="message" id="message">Welcome, Xayla.</div>
<div class="secret">XAYLA.EXE • ONLINE</div>
</section>
</main>
<script>
for(let i=0;i<18;i++){let s=document.createElement("i");s.className="spark";s.style.left=Math.random()*100+"vw";s.style.animationDelay=-(Math.random()*7)+"s";s.style.animationDuration=(5+Math.random()*7)+"s";document.body.appendChild(s)}

const vibes=["✨ CHILL","💜 ICONIC","⚡ LOCKED IN","🌙 NIGHT MODE","🪩 MAIN CHARACTER","☁️ DREAMY","💫 UNBOTHERED"];
const messages=[
"Certified cool page.",
"Today's forecast: probably iconic.",
"System status: vibing.",
"Achievement unlocked: found the hidden page.",
"Zero notifications. Maximum peace.",
"Xayla.exe is running perfectly.",
"Internet real estate acquired."
];
function tick(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});}
setInterval(tick,1000);tick();
function newVibe(){document.getElementById("vibe").textContent=vibes[Math.floor(Math.random()*vibes.length)];}
function randomMessage(){document.getElementById("message").textContent=messages[Math.floor(Math.random()*messages.length)];}
function burst(){
 for(let i=0;i<28;i++){
   const e=document.createElement("span");e.className="pop";e.textContent=["✦","✧","⋆","✨","♡"][Math.floor(Math.random()*5)];
   e.style.left=(innerWidth/2)+"px";e.style.top=(innerHeight/2)+"px";
   e.style.setProperty("--x",(Math.random()*500-250)+"px");e.style.setProperty("--y",(Math.random()*400-200)+"px");
   document.body.appendChild(e);setTimeout(()=>e.remove(),1500);
 }
}

</script>
</body>
</html>
